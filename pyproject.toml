[project]
name = "titanium"
version = "2.0.0"
description = "Multipurpose Discord Bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.30.0",
    "atlas-provider-sqlalchemy>=0.5.2",
    "colorthief>=0.2.1",
    "dacite>=1.9.2",
    "discord-py>=2.7.0",
    "durations>=0.3.3",
    "emoji>=2.15.0",
    "humanize>=4.16.0",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "playwright>=1.62.0",
    "prometheus-client>=0.26.0",
    "psutil>=7.1.3",
    "py-cpuinfo>=9.0.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "qrcode[pil]>=8.2",
    "rapidfuzz>=3.14.3",
    "shortuuid>=1.0.13",
    "sqlalchemy[asyncio]>=2.0.52",
    "topggpy>=1.4.0",
    "wand>=0.7.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["LOG015", "UP037", "BLE001"]

[tool.pyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
